name: 台股報價更新

# ── 設計說明（v4）──────────────────────────────────────────
# 實測發現：GitHub 對這個 repo 的排程有「約 4.5 小時」的固定延遲，
# 而且延遲幅度每天高度一致。cron 排幾個時段不影響結果，
# 每天就是只會實際執行約 2 次。
#
# 因此改用「提前下單」策略：把 cron 排在期望開始時間的
# 4.5 小時之前，讓延遲後剛好對準開盤。
#
# 同時加上防呆：萬一哪天延遲消失、job 太早啟動，
# 等待超過 90 分鐘就直接結束，交給後面的班次接手，
# 避免從凌晨空轉到撞上 6 小時的 job 上限。
# ──────────────────────────────────────────────────────────

on:
  schedule:
    # 主班：20:15 UTC（週日~週四）→ 延遲 4.5h 後約台灣 08:45，正好開盤前
    - cron: '15 20 * * 0-4'
    # 中班：22:00 UTC → 延遲後約台灣 10:30。主班若還在跑會排隊，
    #       等主班收工後執行，剛好補一張收盤快照
    - cron: '0 22 * * 0-4'
    # 末班：00:52 UTC（週一~週五）→ 目前實際會落在台灣 13:20 左右，
    #       保留當最後防線，至少保證每天抓得到收盤
    - cron: '52 0 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-quotes
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 盤中持續抓取
        run: |
          set -u
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BEGIN_TS=$(TZ=Asia/Taipei date -d "today 08:45" +%s)
          END_TS=$(TZ=Asia/Taipei date -d "today 13:40" +%s)
          NOW_TS=$(date +%s)
          MAX_WAIT=5400

          echo "啟動時間（台北）: $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M:%S')"

          commit_and_push () {
            git add -A
            if git diff --staged --quiet; then
              echo "  無變動，略過"
              return
            fi
            git commit -q -m "報價更新 $(TZ=Asia/Taipei date '+%m-%d %H:%M')"
            git pull --rebase -q || echo "  pull 失敗，續行"
            git push -q || echo "  push 失敗，下一輪再試"
          }

          if [ "$NOW_TS" -ge "$END_TS" ]; then
            echo "== 已過盤後時間，單次抓取後結束 =="
            python fetch_quotes.py || echo "抓取失敗"
            commit_and_push
            exit 0
          fi

          if [ "$NOW_TS" -lt "$BEGIN_TS" ]; then
            WAIT=$((BEGIN_TS - NOW_TS))
            if [ "$WAIT" -gt "$MAX_WAIT" ]; then
              echo "== 距開盤還有 $((WAIT / 60)) 分鐘，超過等待上限，"
              echo "   直接結束，交由後續班次接手 =="
              exit 0
            fi
            echo "== 距開盤 $((WAIT / 60)) 分鐘，等待中 =="
            sleep "$WAIT"
          fi

          echo "== 進入盤中迴圈，執行到台灣時間 13:40 =="
          ROUND=0
          while [ "$(date +%s)" -lt "$END_TS" ]; do
            ROUND=$((ROUND + 1))
            echo "--- 第 $ROUND 輪  $(TZ=Asia/Taipei date '+%H:%M:%S') ---"
            python fetch_quotes.py || echo "  本輪抓取失敗，繼續"
            commit_and_push

            REMAIN=$((END_TS - $(date +%s)))
            [ "$REMAIN" -le 300 ] && break
            sleep 300
          done

          echo "== 收盤，共執行 $ROUND 輪 =="
