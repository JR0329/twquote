name: 台股報價更新

on:
  schedule:
    # cron 用 UTC。台股 09:00-13:30 (UTC+8) = 01:00-05:30 UTC
    # 前後多抓一點，涵蓋盤前與盤後
    - cron: '*/5 0-6 * * 1-5'
  workflow_dispatch:        # 允許在 GitHub 網頁上手動按按鈕執行

permissions:
  contents: write           # 需要寫入權限才能把結果 commit 回 repo

concurrency:
  group: fetch-quotes
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 抓取報價
        run: python fetch_quotes.py

      - name: 提交結果
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json history/ 2>/dev/null || git add latest.json
          if git diff --staged --quiet; then
            echo "報價無變動，略過 commit"
          else
            git commit -m "報價更新 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
            git push
          fi
